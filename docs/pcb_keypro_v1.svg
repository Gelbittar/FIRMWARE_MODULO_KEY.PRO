ght="normal">  VIN(+12V) / GND  : alimentación (rango 4.5-12V·DC, LDO a 3.3V a bordo)</text><text x="8.0" y="472.0" font-family="DejaVu Sans, sans-serif" font-size="11.0" fill="#e8e8e8" text-anchor="start" font-weight="normal">  SIRENA S / GND   : entrada sensado (reposo OFF·ALTO; 1 pulso=ARMADO, 2=DESARMADO, estable=LOW=ALARMA)</text><text x="8.0" y="486.0" font-family="DejaVu Sans, sans-serif" font-size="11.0" fill="#e8e8e8" text-anchor="start" font-weight="normal">  ACTIVACION AO/GND: salida relé A activo-bajo (100ms) — arma/desarma el punto de la llave</text><text x="8.0" y="500.0" font-family="DejaVu Sans, sans-serif" font-size="11.0" fill="#e8e8e8" text-anchor="start" font-weight="normal">  PANICO BO / GND   : salida relé B activo-bajo (mantenido) — pánico</text><text x="8.0" y="518.0" font-family="DejaVu Sans, sans-serif" font-size="11.0" fill="#cfd8ff" text-anchor="start" font-weight="normal">P1 (3V3·TXD·RXD·FLASH·RST·GND): flasheo/escala de producción.  SOLDAR JUMPER entre FLASH y GND para programar.</text><text x="8.0" y="532.0" font-family="DejaVu Sans, sans-serif" font-size="11.0" fill="#cfd8ff" text-anchor="start" font-weight="normal">RESET: botón táctil (GPIO2) — mantener 5 s borra config.  Relés se inician APAGADOS (ALTO).</text></svg>