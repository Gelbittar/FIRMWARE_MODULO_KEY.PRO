    <circle cx="160" cy="180" r="28" fill="url(#accentGrad)" opacity="0.8"/>
    <circle cx="352" cy="180" r="28" fill="url(#accentGrad)" opacity="0.8"/>
    <path d="M160 180h-20M352 180h20" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M160 160v-20M352 160v-20" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
