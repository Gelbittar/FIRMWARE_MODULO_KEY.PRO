name: Build APK manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-operator:
    name: Build APK operador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web assets
        run: mkdir -p app/web && cp web/index.html app/web/index.html
      - name: Install app deps
        working-directory: app
        run: npm install
      - name: Add Android platform
        working-directory: app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: geylca-app-operador
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  apk-master:
    name: Build APK consola maestra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web assets
        run: mkdir -p app-master/web && cp web/master.html app-master/web/index.html
      - name: Install app deps
        working-directory: app-master
        run: npm install
      - name: Add Android platform
        working-directory: app-master
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app-master/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: geylca-app-master
          path: app-master/android/app/build/outputs/apk/debug/app-debug.apk