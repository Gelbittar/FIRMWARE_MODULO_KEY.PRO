name: Build APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-operator:
    name: Build APK Operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web assets (Operator)
        run: |
          mkdir -p app/web
          cp web/operator.html app/web/index.html
          cp -r web/css app/web/css
          cp -r web/js app/web/js
          cp -r web/lib app/web/lib
          cp -r web/assets app/web/assets
          cp web/manifest.json app/web/manifest.json
      - name: Install app deps
        working-directory: app
        run: npm install
      - name: Add Android platform
        working-directory: app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: geylca-app-operator
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

