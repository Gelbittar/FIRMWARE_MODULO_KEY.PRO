name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --user -U platformio
      - name: Build firmware
        run: pio run
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware.bin
          retention-days: 3

  apk-operator:
    name: Build APK operador
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web assets
        run: mkdir -p app/web && cp web/index.html app/web/index.html
      - name: Install app deps
        working-directory: app
        run: npm install
      - name: Add Android platform
        working-directory: app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Prepare artifact
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app.apk
          retention-days: 3

  apk-master:
    name: Build APK consola maestra
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web assets
        run: mkdir -p app-master/web && cp web/master.html app-master/web/index.html
      - name: Install app deps
        working-directory: app-master
        run: npm install
      - name: Add Android platform
        working-directory: app-master
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app-master/android
        run: ./gradlew assembleDebug
      - name: Prepare artifact
        run: cp app-master/android/app/build/outputs/apk/debug/app-debug.apk master.apk
      - uses: actions/upload-artifact@v4
        with:
          name: master-apk
          path: master.apk
          retention-days: 3

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [firmware, apk-operator, apk-master]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: master-apk
          path: .
      - name: List assets
        run: ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware.bin
            app.apk
            master.apk
          generate_release_notes: true
      - name: Publish assets to GEYLCA-Assets (publico)
        env:
          PAT: ${{ secrets.ASSETS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$PAT" ]; then
            echo "::error::Secret ASSETS_PAT no esta definido"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS_API="https://api.github.com/repos/Gelbittar/GEYLCA-Assets"
          AUTH="Authorization: Bearer $PAT"
          ID="$(curl -s -H "$AUTH" "$ASSETS_API/releases/tags/$TAG" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("id") or "")')"
          if [ -z "$ID" ]; then
            ID="$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"generate_release_notes\":true}" \
              "$ASSETS_API/releases" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("id") or "")')"
            echo "Release creado en GEYLCA-Assets (id=$ID, tag=$TAG)"
          else
            echo "Release ya existia (id=$ID, tag=$TAG)"
          fi
          for F in firmware.bin app.apk master.apk; do
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary "@$F" \
              "$ASSETS_API/releases/$ID/assets?name=$F" >/dev/null || true
            echo "Asset subido: $F"
          done